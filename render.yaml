services:
  - type: web
    name: mrbs-backend-monolith
    env: docker
    dockerfilePath: backend-monolith/Dockerfile
    context: backend-monolith
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app"
